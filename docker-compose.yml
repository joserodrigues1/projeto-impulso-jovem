  api:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: ij-api
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-impulso}:${POSTGRES_PASSWORD:-impulso}@postgres:5432/${POSTGRES_DB:-impulso_jovem}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3333:3333"

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:3333
    container_name: ij-web
    environment:
      API_INTERNAL_URL: http://api:3333
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pg_data:
  redis_data:
  minio_data:
