name: impulso-jovem

services:
  postgres:
    image: postgres:16-alpine
    container_name: ij-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-impulso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-impulso}
      POSTGRES_DB: ${POSTGRES_DB:-impulso_jovem}
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-impulso} -d ${POSTGRES_DB:-impulso_jovem}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ij-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

